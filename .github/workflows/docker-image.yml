name: Docker build

# Validates that the production image builds end-to-end (frontend bundle +
# backend deps) on every push / PR. No secrets are needed and nothing is pushed
# to a registry — placeholder public build args are enough to compile the SPA.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          tags: groqbot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=
            VITE_SOCKET_URL=
            VITE_APP_ENV=production
            VITE_LLM_PROVIDER=groq
            VITE_DEFAULT_MODEL=llama-3.3-70b-versatile
            VITE_AVAILABLE_MODELS=llama-3.3-70b-versatile
            VITE_MODEL_LABELS=
            VITE_CLERK_PUBLISHABLE_KEY=pk_test_ci_placeholder
