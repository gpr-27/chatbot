# Production-style single-container run of Groqbot.
#
# The backend serves the JSON API and the built React SPA, so the whole app is
# reachable on ONE origin/port — no CORS, one URL.
#
# Configuration comes from the single shared .env at the repo root:
#   • VITE_*  -> read at BUILD time (Vite inlines them) -> passed as build args
#   • backend -> injected at RUN time via env_file
#
# Usage:
#   docker compose up --build      # build + run
#   # then open http://localhost:5002  (or whatever PORT is in .env)
#
# For a real deployment, set NODE_ENV=production and CLIENT_URL to your public
# URL in .env, and leave VITE_API_URL blank (same-origin) — see .env.example.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Blank = same-origin combined deploy: the SPA calls a relative "/api".
        VITE_API_URL: "${VITE_API_URL:-}"
        VITE_SOCKET_URL: "${VITE_SOCKET_URL:-}"
        VITE_APP_ENV: "${VITE_APP_ENV:-production}"
        VITE_LLM_PROVIDER: "${VITE_LLM_PROVIDER:?set VITE_LLM_PROVIDER in .env}"
        VITE_DEFAULT_MODEL: "${VITE_DEFAULT_MODEL:?set VITE_DEFAULT_MODEL in .env}"
        VITE_AVAILABLE_MODELS: "${VITE_AVAILABLE_MODELS:?set VITE_AVAILABLE_MODELS in .env}"
        VITE_MODEL_LABELS: "${VITE_MODEL_LABELS:-}"
        VITE_CLERK_PUBLISHABLE_KEY: "${VITE_CLERK_PUBLISHABLE_KEY:?set VITE_CLERK_PUBLISHABLE_KEY in .env}"
    image: groqbot:latest
    container_name: groqbot
    env_file:
      - .env
    environment:
      # Force production regardless of what .env says (a dev .env uses development).
      NODE_ENV: production
    ports:
      - "${PORT:-5002}:${PORT:-5002}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${PORT:-5002}/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

